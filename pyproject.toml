[project]
name = "autovid"
version = "0.1.0"
description = "Bien mot link bai bao thanh video review dai tieng Viet cho YouTube"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "Pillow>=10.3",
  "matplotlib>=3.8",
  "ddgs>=9.0",
]

[project.optional-dependencies]
align = ["faster-whisper>=1.0"]
upload = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
autovid = "autovid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
