[project]
name = "autovid"
version = "0.1.0"
description = "Pipeline tu dong: link bai bao The Economist -> video review dai tieng Viet cho YouTube"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "numpy>=1.26",
  "soundfile>=0.12",
  "Pillow>=10.3",
  "matplotlib>=3.8",
  "srt>=3.5",
]

[project.optional-dependencies]
align = ["faster-whisper>=1.0"]
upload = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
autovid = "autovid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovid"]

[tool.ruff]
line-length = 100
target-version = "py310"
